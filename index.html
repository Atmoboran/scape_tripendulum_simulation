<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaos-Pendel</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="tripendel"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <span class="logo" data-brand="logo"></span>
  <div class="top-right">
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 300 220" aria-hidden="true">
    <path d="M60,20 A210,210 0 0 1 40,150" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="1 12" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="215" y2="140" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
    <line x1="215" y1="140" x2="120" y2="205" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
    <circle cx="60" cy="20" r="9" fill="currentColor"/><circle cx="215" cy="140" r="16" fill="currentColor"/><circle cx="120" cy="205" r="14" fill="currentColor"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><circle cx="160" cy="200" r="120"/><circle cx="250" cy="200" r="120"/></svg>
  <div class="poster-text">
    <h1 class="headline" data-t-html="poster.headline"></h1>
    <p class="lead" data-t="poster.lead"></p>
  </div>
</div>

<main class="page">
  <div class="lab">
    <div class="lab-pre">
      <p class="text" data-t="intro"></p>
      <div class="section-label" data-t="labels.type"></div>
      <div class="seg-row" id="mode-row">
        <button type="button" class="btn" id="mode-simple" data-n="1" data-t="labels.simple"></button>
        <button type="button" class="btn active" id="mode-double" data-n="2" data-t="labels.double"></button>
        <button type="button" class="btn" id="mode-triple" data-n="3" data-t="labels.triple"></button>
      </div>
      <div class="section-label" data-t="labels.editor"></div>
      <div class="seg-row" id="editor-row">
        <button type="button" class="btn obj active" id="editor-a" data-editor="A"><i></i><span data-t="labels.red"></span></button>
        <button type="button" class="btn obj" id="editor-b" data-editor="B"><i></i><span data-t="labels.blue"></span></button>
      </div>
    </div>

    <div class="lab-stage">
      <div class="stage-frame square fit" id="stage" role="img" data-t-aria="labels.stageAria">
        <canvas id="trail-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
        <div class="stage-legend" aria-hidden="true">
          <span><i class="dot-a"></i><span id="legend-a" data-t="labels.red"></span></span>
          <span><i class="dot-b"></i><span id="legend-b" data-t="labels.blue"></span></span>
        </div>
      </div>
    </div>

    <div class="lab-post">
      <div class="readout-grid" aria-live="polite">
        <div><span data-t="readout.status"></span><b id="ro-status" data-t="readout.ready"></b></div>
        <div><span data-t="readout.time"></span><b id="ro-zeit"></b></div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn big primary" id="sim-primary">
          <svg id="sim-primary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4l14 8-14 8V4z" fill="currentColor" stroke="none"/></svg>
          <span><span id="sim-primary-label" data-t="primary.start"></span><span class="sub" id="sim-primary-sub" data-t="primary.startSub"></span></span>
        </button>
        <button type="button" class="btn big" id="sim-reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
          <span><span data-t="primary.reset"></span><span class="sub" data-t="primary.resetSub"></span></span>
        </button>
      </div>
      <p class="hint" data-t="hint"></p>

      <div class="tasks" id="tp-tasks">
        <h3 data-t="tasks.title"></h3>
        <ul>
          <li data-task="butterfly"><span class="box"></span><span data-t="tasks.butterfly"></span></li>
          <li data-task="calm"><span class="box"></span><span data-t="tasks.calm"></span></li>
        </ul>
      </div>
      <div class="merke locked" data-for="tp-tasks">
        <h3 data-t="merke.title"></h3>
        <p data-t="merke.text"></p>
        <span class="locked-note"></span>
      </div>
    </div>
  </div>

  <div class="topics">
    <details class="topic"><summary data-t="topics.what.title"></summary><div class="topic-body" data-t-html="topics.what.body"></div></details>
    <details class="topic"><summary data-t="topics.weather.title"></summary><div class="topic-body" data-t-html="topics.weather.body"></div></details>
    <details class="topic"><summary data-t="topics.energy.title"></summary><div class="topic-body" data-t-html="topics.energy.body"></div></details>
  </div>
</main>

<footer class="foot">
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/physics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
